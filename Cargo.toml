[package]
name = "pangu"
version = "0.1.0"
edition = "2021"
description = "Terminal-based agentic coding assistant with local LLM inference"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
# HTTP Client for llama-server backend
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"

# TUI Framework
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }

# Async Runtime
tokio = { version = "1", features = ["full", "sync", "macros", "rt-multi-thread"] }
futures = "0.3"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"

# CLI
clap = { version = "4", features = ["derive"] }

# Error Handling
color-eyre = "0.6"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
async-trait = "0.1"
url = "2"
urlencoding = "2"

# Unix signal handling
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Markdown rendering
pulldown-cmark = "0.10"
syntect = "5"

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[dev-dependencies]
tempfile = "3"
