# Pangu Configuration
# This file is compiled into the binary - changes require recompilation

[model]
# Hugging Face repository containing the model
hf_repo = "nunocoracao/pangu"
# Model filename (downloaded to ~/.pangu/models/)
filename = "devstral-small-2-q4.gguf"
# Number of layers to offload to GPU (0 = CPU only, -1 = all)
n_gpu_layers = -1
# Context window size (model supports up to 131K, but 8K is memory-friendly)
context_size = 8192
# Temperature for sampling (0.0 = deterministic, higher = more random)
temperature = 0.2
# Top-p sampling
top_p = 0.95

[ui]
# Frames per second for rendering
frame_rate = 30.0
# Ticks per second for updates
tick_rate = 4.0
