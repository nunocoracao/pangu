# Pangu Default Configuration

[model]
# Path to the GGUF model file
path = "./models/devstral-small-2-q4.gguf"
# Number of layers to offload to GPU (0 = CPU only, -1 = all)
n_gpu_layers = -1
# Context window size
context_size = 8192
# Temperature for sampling (0.0 = deterministic, higher = more random)
temperature = 0.15
# Top-p sampling
top_p = 0.95

[ui]
# Frames per second for rendering
frame_rate = 30.0
# Ticks per second for updates
tick_rate = 4.0

[system]
# System prompt for the assistant
prompt = """You are Pangu, a helpful coding assistant running locally. You assist with software engineering tasks including writing code, debugging, explaining code, and file operations.

Guidelines:
- Be concise and direct
- Provide working code, not pseudocode
- Explain your reasoning when helpful
- Ask clarifying questions when requirements are ambiguous
- Prioritize correctness over cleverness"""
