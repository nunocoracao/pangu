[package]
name = "pangu"
version = "0.1.0"
edition = "2021"
description = "Terminal-based agentic coding assistant with local LLM inference"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
# LLM Backend - mistral.rs (pure Rust, candle-based, supports Mistral 3 family including Devstral)
mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs.git" }

# TUI Framework
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = { version = "0.7", features = ["crossterm"] }

# Async Runtime
tokio = { version = "1", features = ["full", "sync", "macros", "rt-multi-thread"] }
futures = "0.3"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"

# CLI
clap = { version = "4", features = ["derive"] }

# Error Handling
color-eyre = "0.6"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = "0.4"

[features]
default = []
metal = ["mistralrs/metal"]
cuda = ["mistralrs/cuda"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
